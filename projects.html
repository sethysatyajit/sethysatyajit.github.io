<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="img/Logo.png" type="image/png">
  <title>Projects | Satyajit Sethy</title>
  <meta name="description" content="Search and filter projects by Satyajit Sethy: web development, cybersecurity, DevOps and tools.">
  <meta name="author" content="Satyajit Sethy">
  <meta name="theme-color" content="#0a0f1e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar is injected from js/components.js -->
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1 class="pop-in">Projects</h1>
        <p class="pop-in" style="--d:150ms">Search by keyword or filter by category to find what you are looking for.</p>
      </div>
    </section>
    <section style="padding-top:40px">
      <div class="container">
        <div class="toolbar pop-in" style="--d:250ms">
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="project-search" type="search" placeholder="Search projects, e.g. OSINT, Bash, chat" aria-label="Search projects" autocomplete="off">
          </label>
          <div class="filters" id="project-filters" role="group" aria-label="Filter by category"></div>
        </div>
        <p class="result-count" id="result-count" aria-live="polite"></p>
        <div class="project-grid" id="project-grid"></div>
        <div class="empty" id="empty">
          <h3>No projects match your search</h3>
          <p>Try a different keyword or clear the filters.</p>
          <button class="btn btn-ghost btn-sm" id="reset-search" style="margin-top:18px">Clear search</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer is injected from js/components.js -->
  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
